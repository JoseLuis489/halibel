[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halibel-backend"
version = "0.1.0"
description = "Halibel AI Companion Local Runtime"
authors = [{ name = "Gustavo" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "google-genai>=2.30.1",
    "send2trash>=1.8.3",
    "websockets>=13.1",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
