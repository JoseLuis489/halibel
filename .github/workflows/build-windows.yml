name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Compile Backend Executable (PyInstaller)
        run: |
          cd backend
          pyinstaller --noconfirm --onedir --windowed --name "halibel-backend" --add-data ".env.example;." app/main.py
          cd ..

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Prepare Sidecar for Electron
        shell: bash
        run: |
          mkdir -p desktop/resources/bin
          cp -r backend/dist/halibel-backend/* desktop/resources/bin/

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          pnpm install

      - name: Build Electron App for Windows
        run: |
          cd desktop
          pnpm run build:win

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halibel-Windows-Build
          path: |
            desktop/release/*.exe
          retention-days: 14
